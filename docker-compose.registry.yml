services:
  registry:
    image: registry:2
    ports:
      - "${PORT_REGISTRY}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - registry-net

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    ports:
      - "${PORT_REGISTRY_UI}:80"
    environment:
      REGISTRY_TITLE: Registry TP13
      NGINX_PROXY_PASS_URL: http://registry:5000
      DELETE_IMAGES: "true"
      SINGLE_REGISTRY: "true"
    depends_on:
      - registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - registry-net

volumes:
  registry-data:

networks:
  registry-net:
    driver: bridge
