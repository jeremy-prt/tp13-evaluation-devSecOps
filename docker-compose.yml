services:
  cat:
    build: ./api
    image: localhost:${PORT_REGISTRY}/mon-api:1.0.0
    environment:
      PORT: ${PORT_API}
      PET: ${PET_CAT}
    networks:
      - tp13-net

  dog:
    build: ./api
    image: localhost:${PORT_REGISTRY}/mon-api:1.0.0
    environment:
      PORT: ${PORT_API}
      PET: ${PET_DOG}
    networks:
      - tp13-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_NGINX}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tp13-net

  prometheus:
    image: prom/prometheus:v3.11.3
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tp13-net

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "${PORT_GRAFANA}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tp13-net

  node-exporter:
    image: prom/node-exporter:v1.11.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tp13-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - tp13-net

  portainer:
    image: portainer/portainer-ce:2.41.1-alpine
    ports:
      - "${PORT_PORTAINER}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tp13-net

networks:
  tp13-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  portainer-data:
