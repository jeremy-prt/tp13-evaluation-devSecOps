services:
  cat:
    build: ./api
    image: localhost:${PORT_REGISTRY}/mon-api:1.0.0
    environment:
      PORT: ${PORT_API}
      PET: ${PET_CAT}
    networks:
      - tp13-net

  dog:
    build: ./api
    image: localhost:${PORT_REGISTRY}/mon-api:1.0.0
    environment:
      PORT: ${PORT_API}
      PET: ${PET_DOG}
    networks:
      - tp13-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_NGINX}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
    networks:
      - tp13-net

networks:
  tp13-net:
    driver: bridge
