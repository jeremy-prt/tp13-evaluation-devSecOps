name: docker-ci

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t mon-api:${{ steps.sha.outputs.value }} ./api

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "mon-api:${{ steps.sha.outputs.value }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag mon-api:${{ steps.sha.outputs.value }} ${{ secrets.DOCKERHUB_USERNAME }}/mon-api:git-${{ steps.sha.outputs.value }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-api:git-${{ steps.sha.outputs.value }}
